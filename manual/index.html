const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const cards = [...document.querySelectorAll('.cd')];
const screenEl = $('#main');
const ov = $('#ov');

const br = s => esc(s).replace(/\n/g, '<br>');
function rowsHtml(rows, sm){ return `<dl class="rows${sm ? ' sm' : ''}">${rows.map(([k, v]) => `<dt>${br(k)}</dt><dd>${br(v).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/\(@[^)]+\)/g, '<span class="nt">$&</span>')}</dd>`).join('')}</dl>`; }
const liHtml = s => s.split('\n').map(l => { const t = esc(l).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>'); return /^[└ㄴ]/.test(l) ? `<span class="nt">${t}</span>` : t; }).join('<br>');
function itemHtml(x){
  if (typeof x === 'string' || !x.sub || !x.sub.length) return `<li>${liHtml(typeof x === 'string' ? x : x.t)}</li>`;
  return `<li class="has"><button class="li-h" aria-expanded="false"><span class="li-t">${liHtml(x.t)}</span><span class="li-i"><svg viewBox="0 0 8 8"><path d="M4 .8V7.2M.8 4H7.2"/></svg></span></button><div class="li-w"><div class="li-c"><div class="li-b">${x.sub.map(y => `<p>${liHtml(y)}</p>`).join('')}</div></div></div></li>`;
}
function blockHtml(b){
  let h = `<div class="blk${b.toggles ? ' tgb' : ''}">`;
  if (b.h) h += `<h4>${esc(b.h)}</h4>`;
  if (b.sub) h += `<p class="sub">${br(b.sub)}</p>`;
  if (b.lead) h += `<p class="lead">${esc(b.lead)}</p>`;
  if (b.note) h += `<p class="note">${b.note.split('\n').map(l => /^\d+\)/.test(l) ? `<small>${esc(l)}</small>` : esc(l)).join('<br>')}</p>`;
  if (b.search) h += `<label class="srch"><svg viewBox="0 0 16 16"><circle cx="6.8" cy="6.8" r="4.8"/><path d="M10.4 10.4 14.5 14.5"/></svg><input type="search" placeholder="검색" autocomplete="off" spellcheck="false"></label>`;
  if (b.rows) h += rowsHtml(b.rows, b.sm);
  if (b.search) h += `<p class="srch-no" hidden>검색 결과 없음</p>`;
  if (b.list) h += `<ul class="lst">${b.list.map(itemHtml).join('')}</ul>`;
  if (b.toggles) h += `<div class="tgs">${b.toggles.map(t => `<div class="tg${t.main ? ' main on' : ''}"><button class="tg-h" aria-expanded="${t.main ? 'true' : 'false'}"><span class="tg-t"><small><span class="tg-r">${t.main ? 'MAIN' : 'SUB'}</span>${t.tag ? `<span class="tg-r">${esc(t.tag)}</span>` : ''}${esc(t.handle)}</small><b>${esc(t.names)}</b></span><span class="tg-i"><svg viewBox="0 0 8 8"><path d="M4 .8V7.2M.8 4H7.2"/></svg></span></button><div class="tg-w"><div class="tg-c"><div class="tg-b">${t.img ? `<img class="tg-im" src="${esc(t.img)}" alt="">` : '<div class="tg-im"></div>'}<div class="tg-n">${esc(t.title)}</div><ul class="tg-k">${t.tags.map(x => `<li>${esc(x)}</li>`).join('')}</ul><p class="tg-s">${br(t.syn)}</p></div></div></div></div>`).join('')}</div>`;
  return h + '</div>';
}
function wireSearch(inp, rows){
  const blk = inp.closest('.blk'), dts = blk.querySelectorAll('.rows dt'), dds = blk.querySelectorAll('.rows dd'), no = blk.querySelector('.srch-no');
  const hl = (s, q) => {
    if (!q) return br(s);
    const lo = s.toLowerCase(); let out = '', i = 0, j;
    while ((j = lo.indexOf(q, i)) > -1){ out += br(s.slice(i, j)) + `<mark>${br(s.slice(j, j + q.length))}</mark>`; i = j + q.length; }
    return out + br(s.slice(i));
  };
  inp.addEventListener('input', () => {
    const cp = inp.closest('.cp'), dl = blk.querySelector('.rows');
    if (!cp.style.minHeight){
      cp.style.minHeight = cp.offsetHeight + 'px';
      dl.style.gridTemplateColumns = getComputedStyle(dl).gridTemplateColumns.split(' ')[0] + ' 1fr';
    }
    const q = inp.value.trim().toLowerCase(); let n = 0;
    rows.forEach(([k, v], i) => {
      const hit = !q || (k + '\n' + v).toLowerCase().includes(q);
      dts[i].hidden = dds[i].hidden = !hit; if (hit) n++;
      dts[i].innerHTML = hl(k, q); dds[i].innerHTML = hl(v, q);
    });
    no.hidden = n > 0;
  });
}
function openPop(k){
  const d = DATA[k]; if (!d) return;
  $('#cpNo').textContent = d.no; ov.classList.toggle('slot', !!d.slot); $('#cpName').textContent = d.name; $('#cpSub').textContent = d.sub || '';
  $('#cpBd').innerHTML = d.blocks.map(blockHtml).join('');
  $('#cpBd').scrollTop = 0; ov.querySelector('.cp').style.minHeight = '';
  $('#cpBd').querySelectorAll('.srch input').forEach((inp, i) => wireSearch(inp, d.blocks.filter(b => b.search)[i].rows));
  if (document.documentElement.classList.contains('embed')){
    const cd = cards.find(x => x.dataset.k === k), sr = screenEl.getBoundingClientRect();
    const top = cd ? cd.getBoundingClientRect().top - sr.top - 10 : 24;
    ov.style.setProperty('--cp-top', Math.max(14, Math.round(top)) + 'px');
    if ('IntersectionObserver' in window){
      ov.classList.add('wait');
      const done = () => ov.classList.remove('wait');
      const io = new IntersectionObserver(([en]) => {
        io.disconnect(); clearTimeout(t);
        const vis = en.intersectionRect, cp = ov.querySelector('.cp');
        if (vis.height > 40){
          const h = cp.offsetHeight, y = vis.top - en.boundingClientRect.top - parseFloat(getComputedStyle(ov).paddingTop);
          ov.style.setProperty('--cp-top', Math.round(Math.max(0, y + Math.max(14, (vis.height - h) / 2))) + 'px');
        }
        done();
      });
      const t = setTimeout(() => { io.disconnect(); done(); }, 400);
      io.observe(screenEl);
    }
  }
  ov.classList.add('on');
}
function closePop(){ ov.classList.remove('on', 'wait'); screenEl.style.minHeight = ''; }
function refit(){
  if (!document.documentElement.classList.contains('embed') || !ov.classList.contains('on')) return;
  screenEl.style.minHeight = '';
  const sr = screenEl.getBoundingClientRect(), over = ov.querySelector('.cp').getBoundingClientRect().bottom + 14 - sr.bottom;
  if (over > 0) screenEl.style.minHeight = Math.ceil(sr.height + over) + 'px';
}
if ('ResizeObserver' in window) new ResizeObserver(refit).observe(ov.querySelector('.cp'));
cards.forEach(c => c.addEventListener('click', () => openPop(c.dataset.k)));
$('#cpBd').addEventListener('click', e => {
  const lh = e.target.closest('.li-h');
  if (lh){ const on = lh.parentNode.classList.toggle('on'); lh.setAttribute('aria-expanded', on); return; }
  const h = e.target.closest('.tg-h'); if (!h) return;
  const tg = h.parentNode, on = !tg.classList.contains('on');
  tg.parentNode.querySelectorAll('.tg').forEach(x => { x.classList.remove('on'); x.querySelector('.tg-h').setAttribute('aria-expanded', 'false'); });
  tg.classList.toggle('on', on); h.setAttribute('aria-expanded', on);
});
$('#cpX').addEventListener('click', closePop);
ov.addEventListener('click', e => { if (e.target === ov) closePop(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') closePop(); });

const q = new URLSearchParams(location.search || (() => { try { return location.hostname === 'localhost' ? parent.location.search : ''; } catch (e) { return ''; } })());
if (q.get('pop') && DATA[q.get('pop')]) openPop(q.get('pop'));
