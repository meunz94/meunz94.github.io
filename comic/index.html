function halftone(cv, img, cfg){
  cfg = cfg || {};
  const zoom = cfg.zoom || 1, fx = cfg.fx == null ? .5 : cfg.fx, fy = cfg.fy == null ? .5 : cfg.fy;

  const cell = 4.2 * dpr;                           /* 망점 간격 */
  const cols = Math.ceil(cv.width / cell) + 1, rows = Math.ceil(cv.height / cell) + 1;
  const off = document.createElement('canvas'); off.width = cols; off.height = rows;
  const o = off.getContext('2d');
  const s = Math.max(cols / img.naturalWidth, rows / img.naturalHeight) * zoom;
  const dw = img.naturalWidth * s, dh = img.naturalHeight * s;
  o.drawImage(img, (cols - dw) * fx, (rows - dh) * fy, dw, dh);
  let d;
  try { d = o.getImageData(0, 0, cols, rows).data; }
  catch (e) { cv.style.display = 'none'; img.style.opacity = 1; img.style.filter = 'grayscale(1) contrast(1.4)'; return; }
  ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, cv.width, cv.height);
  ctx.fillStyle = '#111';
  ctx.beginPath();
  const rMax = cell * 0.64;
  for (let y = 0; y < rows; y++){
    const stag = (y & 1) ? cell / 2 : 0;
    for (let x = 0; x < cols; x++){
      const i = (y * cols + x) * 4;
      let l = (d[i] * .299 + d[i+1] * .587 + d[i+2] * .114) / 255;
      l = Math.min(1, Math.max(0, (l - .5) * 1.35 + .5));    /* 대비 */
      const r = (1 - l) * rMax;
      if (r < .35) continue;
      const cx = x * cell + stag, cy = y * cell;
      ctx.moveTo(cx + r, cy); ctx.arc(cx, cy, r, 0, Math.PI * 2);
    }
  }
  ctx.fill();
}

const isNarrow = () => document.documentElement.classList.contains('narrow');
const pick = (o) => (isNarrow() && o && o.narrow) ? Object.assign({}, o, o.narrow) : o;
const panels = [...document.querySelectorAll('.pn')];
function applyImg(p){
  const k = p.dataset.k, cv = p.querySelector('.ht'), img = p.querySelector('.orig');
  const c = pick(IMG[k]);
  if (!c || !c.src) { cv.style.display = 'none'; return; }
  const zoom = c.zoom || 1, fx = c.fx == null ? .5 : c.fx, fy = c.fy == null ? .5 : c.fy;
  img.style.objectPosition = `${fx * 100}% ${fy * 100}%`;
  img.style.width = img.style.height = zoom * 100 + '%';
  img.style.left = -(zoom - 1) * 100 * fx + '%'; img.style.top = -(zoom - 1) * 100 * fy + '%';
  if (img.naturalWidth) halftone(cv, img, c);
}
panels.forEach(p => {
  const img = p.querySelector('.orig'), c = IMG[p.dataset.k];
  if (!c || !c.src) { p.querySelector('.ht').style.display = 'none'; return; }
  img.crossOrigin = 'anonymous';
  img.onload = () => applyImg(p);
  img.src = c.src;
  applyImg(p);
});
let rt; window.addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(() => panels.forEach(applyImg), 120); });

/* ═════════ 말풍선 ═════════ */
const bubSvg = $('#bubSvg'), gStroke = bubSvg.querySelector('.bs'), gFill = bubSvg.querySelector('.bf'),
      tailFill = bubSvg.querySelector('.tf'), tailLine = bubSvg.querySelector('.tl'), gBox = bubSvg.querySelector('.bxg'),
      bubTxts = $('#bubTxts');
const screenEl = $('#main');
const sOff = () => { const r = screenEl.getBoundingClientRect(); return document.documentElement.classList.contains('embed') ? [r.left, r.top] : [0, 0]; };
const SVG = (tag, attrs) => { const el = document.createElementNS('http://www.w3.org/2000/svg', tag); for (const k in attrs) el.setAttribute(k, attrs[k]); return el; };

function rrPath(bx, by, hw, hh, rr){
  const w = hw * 2, h = hh * 2;
  return `M${bx - hw + rr},${by - hh} h${w - 2 * rr} a${rr},${rr} 0 0 1 ${rr},${rr} v${h - 2 * rr} a${rr},${rr} 0 0 1 ${-rr},${rr} h${-(w - 2 * rr)} a${rr},${rr} 0 0 1 ${-rr},${-rr} v${-(h - 2 * rr)} a${rr},${rr} 0 0 1 ${rr},${-rr} z`;
}
/* 중심에서 각도 a 방향으로 나간 둥근 네모 가장자리 점 */
function rrPoint(hw, hh, r, a){
  const dx = Math.cos(a), dy = Math.sin(a);
  let t = Math.min(Math.abs(dx) > 1e-6 ? hw / Math.abs(dx) : 1e9, Math.abs(dy) > 1e-6 ? hh / Math.abs(dy) : 1e9);
  let px = dx * t, py = dy * t;
  if (Math.abs(px) > hw - r && Math.abs(py) > hh - r){
    const cx = Math.sign(px) * (hw - r), cy = Math.sign(py) * (hh - r);
    const b = dx * cx + dy * cy, c = cx * cx + cy * cy - r * r;
    t = b + Math.sqrt(Math.max(0, b * b - c)); px = dx * t; py = dy * t;
  }
  return [px, py, t];
}
function tailPaths(b, deg){
  const { bx, by, hw, hh, r } = b;
  const a = deg * Math.PI / 180, len = 17, base = 5.5;   /* 꼬리 길이·밑변 반폭 */
  const [ex, ey, et] = rrPoint(hw, hh, r, a);
  const da = base / et;
  const [x1, y1] = rrPoint(hw, hh, r, a - da), [x2, y2] = rrPoint(hw, hh, r, a + da);
  const cosA = Math.cos(a), sinA = Math.sin(a);
  const p1 = [bx + x1, by + y1], p2 = [bx + x2, by + y2];
  const tip = [bx + ex + len * cosA, by + ey + len * sinA];
  const nx = -sinA * 3, ny = cosA * 3;                                  /* 살짝 휘는 방향 */
  const c1 = [(p1[0] + tip[0]) / 2 + nx, (p1[1] + tip[1]) / 2 + ny];
  const c2 = [(p2[0] + tip[0]) / 2 + nx, (p2[1] + tip[1]) / 2 + ny];
  const i1 = [p1[0] - cosA * 3, p1[1] - sinA * 3], i2 = [p2[0] - cosA * 3, p2[1] - sinA * 3];  /* 몸통 안쪽으로 */
  const curve = `Q${c1[0]},${c1[1]} ${tip[0]},${tip[1]} Q${c2[0]},${c2[1]} ${p2[0]},${p2[1]}`;
  return [`M${i1[0]},${i1[1]} L${p1[0]},${p1[1]} ${curve} L${i2[0]},${i2[1]} Z`, `M${p1[0]},${p1[1]} ${curve}`];
}

function showBub(p){
  hideBub();
  const cfg = pick(BUB[p.dataset.k]); if (!cfg) return;
  const r = p.getBoundingClientRect(), [ox, oy] = sOff();
  const pl = r.left - ox, pt = r.top - oy;
  cfg.parts.forEach(part => {
    const d = document.createElement('div');
    d.className = 'bub-t' + (part.box ? ' box' : ''); d.textContent = part.t; if (part.fs) d.style.fontSize = part.fs + 'px';
    if (!/\n/.test(part.t)) d.style.whiteSpace = 'nowrap';            /* 줄바꿈 표시 없는 문구는 절대 안 접힘 */
    bubTxts.appendChild(d);
    const tw = d.offsetWidth, th = d.offsetHeight;
    let bx = pl + r.width * part.ax, by = pt + r.height * part.ay;
    if (part.box){
      /* 나레이션 박스: 칸 안에 가둠, 넘치면 글자 줄바꿈 */
      const w = Math.min(tw + 44, r.width - 16);                       /* 글자 사방 여백 넉넉히 */
      d.style.width = (w - 36) + 'px'; d.style.whiteSpace = 'pre-wrap'; d.style.wordBreak = 'keep-all';
      const h = d.offsetHeight + 30;
      bx = Math.min(Math.max(bx, pl + 8 + w / 2), pl + r.width - 8 - w / 2);
      by = Math.min(Math.max(by, pt + 8 + h / 2), pt + r.height - 8 - h / 2);
      gBox.appendChild(SVG('rect', { class:'bx', x:bx - w / 2, y:by - h / 2, width:w, height:h }));
    } else {
      let hw, hh, rr;
      if (part.shape === 'round'){ const w = Math.max(44, Math.max(tw, th) / .58); hw = hh = rr = w / 2; }
      else { const ratio = part.ratio || .78, pad = part.pad || .7, vf = part.vf || (pad - .08); const w = Math.max(84, tw / pad), h = Math.max(w * ratio, th / vf); hw = w / 2; hh = h / 2; rr = Math.min(hw, hh) * .9; }
      const dpath = rrPath(bx, by, hw, hh, rr);
      gStroke.appendChild(SVG('path', { d:dpath }));
      gFill.appendChild(SVG('path', { d:dpath }));
      if (part.tail != null){ const [f, l] = tailPaths({ bx, by, hw:hw + 1, hh:hh + 1, r:rr + 1 }, part.tail);   /* 보이는 테두리 중심(가장자리+1px)에 맞춤 */ tailFill.setAttribute('d', f); tailLine.setAttribute('d', l); }
    }
    d.style.left = bx + 'px'; d.style.top = by + 'px';
  });
  bubSvg.classList.add('on');
}
function hideBub(){
  bubSvg.classList.remove('on');
  gStroke.innerHTML = gFill.innerHTML = gBox.innerHTML = ''; tailFill.setAttribute('d', ''); tailLine.setAttribute('d', ''); bubTxts.innerHTML = '';
}

const NOHOVER = window.matchMedia('(hover: none)');
let tapTimer = null;
panels.forEach(p => {
  p.addEventListener('mouseenter', () => { if (NOHOVER.matches) return; p.classList.add('on'); showBub(p); });
  p.addEventListener('mouseleave', () => { if (NOHOVER.matches) return; p.classList.remove('on'); hideBub(); });
  p.addEventListener('click', () => {
    if (!NOHOVER.matches) { openPop(p.dataset.k); return; }
    /* 터치: 말풍선 + 흑백 전환을 먼저 보여주고 잠시 뒤 팝업 */
    clearTimeout(tapTimer);
    panels.forEach(x => x.classList.remove('on'));
    p.classList.add('on'); showBub(p);
    tapTimer = setTimeout(() => openPop(p.dataset.k), 1100);
  });
});

/* ═════════ 만화책 팝업 ═════════ */
const ov = $('#ov');
const br = s => esc(s).replace(/\n/g, '<br>');
function rowsHtml(rows, sm){ return `<dl class="rows${sm ? ' sm' : ''}">${rows.map(([k, v]) => `<dt>${br(k)}</dt><dd>${br(v)}</dd>`).join('')}</dl>`; }
function blockHtml(b){
  let h = '<div class="blk">';
  if (b.h) h += `<h4>${esc(b.h)}</h4>`;
  if (b.sub) h += `<p class="sub">${br(b.sub)}</p>`;
  if (b.lead) h += `<p class="lead">${esc(b.lead)}</p>`;
  if (b.rows) h += rowsHtml(b.rows, b.sm);
  if (b.list) h += `<ul class="lst">${b.list.map(x => `<li>${br(x)}</li>`).join('')}</ul>`;
  if (b.pair) h += `<div class="pair">${b.pair.map(c => `<div class="pc"><img src="${c.img}" alt=""><div class="n">${esc(c.n)}</div><div class="kr">${esc(c.kr)}</div>${rowsHtml(c.rows)}</div>`).join('')}</div>`;
  return h + '</div>';
}
function openPop(k){
  const d = DATA[k];
  $('#cpCap').textContent = d.cap; $('#cpName').textContent = d.name; $('#cpSub').textContent = d.sub || '';
  $('#cpBd').innerHTML = d.blocks.map(blockHtml).join('');
  $('#cpBd').scrollTop = 0;
  if (document.documentElement.classList.contains('embed')){
    /* 폴백: 누른 칸 위치 */
    const pn = panels.find(x => x.dataset.k === k), sr = screenEl.getBoundingClientRect();
    const top = pn ? pn.getBoundingClientRect().top - sr.top - 10 : 24;
    ov.style.setProperty('--cp-top', Math.max(14, Math.round(top)) + 'px');
    if ('IntersectionObserver' in window){
      ov.classList.add('wait');
      const done = () => ov.classList.remove('wait');
      const io = new IntersectionObserver(([en]) => {
        io.disconnect(); clearTimeout(t);
        const vis = en.intersectionRect, cp = ov.querySelector('.cp');
        if (vis.height > 40){
          const h = cp.offsetHeight, y = vis.top - en.boundingClientRect.top - parseFloat(getComputedStyle(ov).paddingTop);   /* 보이는 구간의 .screen 기준 위치(.ov 안쪽 여백 빼고) */
          ov.style.setProperty('--cp-top', Math.round(Math.max(0, y + Math.max(14, (vis.height - h) / 2))) + 'px');
        }
        done();
      });
      const t = setTimeout(() => { io.disconnect(); done(); }, 400);
      io.observe(screenEl);
    }
  }
  ov.classList.add('on');
  hideBub(); panels.forEach(p => p.classList.remove('on'));
}
function closePop(){ ov.classList.remove('on', 'wait'); clearTimeout(tapTimer); panels.forEach(p => p.classList.remove('on')); hideBub(); }
$('#cpX').addEventListener('click', closePop);
ov.addEventListener('click', e => { if (e.target === ov) closePop(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') closePop(); });

const q = new URLSearchParams(location.search);
/* 디버그: ?pop=notice|pair|ng|list  ?hover=notice|… (고정 커서로 호버 상태 재현) */
if (q.get('hover')){ const p = panels.find(x => x.dataset.k === q.get('hover')); if (p) window.addEventListener('load', () => setTimeout(() => { const r = p.getBoundingClientRect(); p.classList.add('on'); showBub(p); }, 1500)); }
if (q.get('pop') && DATA[q.get('pop')]) openPop(q.get('pop'));
</script>
</body>
