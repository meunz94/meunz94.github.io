<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prompt</title>
<style>
  :root{
    --bg:#fff;
    --fill:rgba(118,118,128,.12);
    --fill2:rgba(118,118,128,.08);
    --label:#000;
    --label2:rgba(60,60,67,.6);
    --label3:rgba(60,60,67,.3);
    --sep:rgba(60,60,67,.12);
    --tint:#007aff;
    --ease:cubic-bezier(.32,.72,0,1);
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--label)}
  html{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
  img{-webkit-user-drag:none;user-drag:none}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Apple SD Gothic Neo","Pretendard",system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
    padding:calc(46vh - 110px) 16px 64px;
    transition:padding-top .6s var(--ease);
  }
  body.open{padding-top:clamp(24px,7vh,80px)}

  .win{
    width:100%;max-width:560px;margin:0 auto;
    background:#fff;
    border-radius:20px;
    box-shadow:0 0 0 .5px rgba(0,0,0,.14),0 2px 6px rgba(0,0,0,.05),0 22px 60px rgba(0,0,0,.16);
    overflow:hidden;
    transition:max-width .6s var(--ease);
  }
  body.open .win{max-width:820px}

  .search{
    display:flex;align-items:center;gap:12px;
    height:58px;padding:0 18px 0 20px;
    border-bottom:.5px solid var(--sep);
  }
  .search svg{flex:none;color:var(--label2)}
  .search .term{
    flex:1;min-width:0;position:relative;height:26px;
    font-size:21px;font-weight:300;letter-spacing:-.02em;line-height:26px;
  }
  .search .term span{
    position:absolute;left:0;top:0;white-space:nowrap;
    transition:opacity .3s,transform .4s var(--ease);
  }
  .search .ph{color:var(--label3)}
  .search .val{opacity:0;transform:translateY(6px);font-weight:500}
  body.open .search .ph{opacity:0;transform:translateY(-6px)}
  body.open .search .val{opacity:1;transform:none}
  .search .clear{
    flex:none;width:18px;height:18px;border-radius:50%;border:0;padding:0;cursor:pointer;
    background:var(--label3);color:#fff;font-size:10px;line-height:18px;
    opacity:0;pointer-events:none;transition:opacity .3s;
  }
  body.open .search .clear{opacity:1;pointer-events:auto}

  .fold{display:grid;grid-template-rows:1fr;transition:grid-template-rows .6s var(--ease),opacity .4s}
  .fold > div{overflow:hidden;min-height:0}
  .recent.fold{opacity:1}
  body.open .recent.fold{grid-template-rows:0fr;opacity:0}
  .view.fold{grid-template-rows:0fr;opacity:0}
  body.open .view.fold{grid-template-rows:1fr;opacity:1}

  .recent > div{padding:0 8px}
  .recent .cap{
    font-size:12px;font-weight:600;color:var(--label2);padding:12px 12px 6px;
  }
  .recent ul{list-style:none;margin:0;padding:0 0 8px}
  .recent li{
    display:flex;align-items:center;gap:10px;
    height:38px;padding:0 12px;border-radius:9px;cursor:pointer;
    font-size:15px;letter-spacing:-.01em;
  }
  .recent li svg{flex:none;color:var(--label2)}
  .recent li .go{margin-left:auto;color:var(--label3);font-size:14px}
  .recent li:hover{background:var(--tint);color:#fff}
  .recent li:hover svg,.recent li:hover .go{color:rgba(255,255,255,.85)}

  .sheet{padding:14px 16px 16px}

  .subs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
  .subs button{
    flex:none;border:0;cursor:pointer;
    height:30px;padding:0 14px;border-radius:15px;
    background:var(--fill2);color:var(--label);
    font:inherit;font-size:14px;letter-spacing:-.01em;
  }
  .subs button.on{background:var(--label);color:#fff;font-weight:600}
  .subs button:disabled{color:var(--label3);cursor:default}

  .chars{display:grid;gap:12px;margin-top:12px}
  .chars.swap{animation:swap .35s var(--ease)}
  @keyframes swap{from{opacity:0;transform:translateY(8px)}}
  .char{
    display:grid;grid-template-columns:200px 1fr;gap:14px;
    padding:12px;border-radius:16px;background:var(--fill2);
  }
  .pic{
    position:relative;min-height:266px;border-radius:12px;overflow:hidden;background:var(--fill);
    display:flex;align-items:center;justify-content:center;
    color:var(--label3);font-size:12px;
  }
  .pic img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 0;display:block;cursor:zoom-in}
  .body{min-width:0;display:flex;flex-direction:column;gap:10px}
  .name{font-size:17px;font-weight:600;letter-spacing:-.02em}
  .name small{font-size:15px;font-weight:400;color:var(--label2);letter-spacing:-.01em}
  .meta{font-size:12.5px;color:var(--label2);margin-top:2px}
  .note{list-style:none;margin:6px 0 0;padding:0;display:grid;gap:3px;
    font-size:12.5px;line-height:1.5;color:var(--label2);word-break:keep-all}
  .note li{display:flex;gap:6px}
  .note b{flex:none;width:22px;font-size:11px;font-weight:700;letter-spacing:.02em;line-height:18.75px}
  .note .ok{color:#34c759}
  .note .ng{color:#ff3b30}
  .block{display:flex;flex-direction:column;gap:6px}
  .bhead{display:flex;align-items:center;justify-content:space-between;gap:8px}
  .bhead b{font-size:12px;font-weight:600;color:var(--label2);letter-spacing:.02em;text-transform:uppercase}
  .copy{
    flex:none;border:0;cursor:pointer;height:26px;padding:0 12px;border-radius:13px;
    background:#fff;color:var(--tint);font:inherit;font-size:13px;font-weight:600;
  }
  .copy:disabled{color:var(--label3);cursor:default}
  .copy.done{color:#34c759}
  .prompt{
    margin:0;padding:10px 12px;border-radius:10px;background:#fff;
    font-family:"SF Mono",ui-monospace,Menlo,monospace;font-size:12.5px;line-height:1.6;
    white-space:pre-wrap;word-break:break-word;color:var(--label);
    min-height:64px;max-height:220px;overflow:auto;
  }
  .prompt.empty{color:var(--label3);font-family:inherit}
  .blocks{display:flex;flex-direction:column;gap:10px}
  .prompt .ln{display:block}
  .prompt .ln + .ln{margin-top:6px}
  .prompt .lt{
    display:inline-block;margin-right:6px;padding:0 5px;border-radius:4px;
    background:var(--fill2);color:var(--label2);
    font:normal 500 10px/16px -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",sans-serif;
    vertical-align:1px;user-select:none;-webkit-user-select:none;
  }
  .prompt mark{background:rgba(255,214,10,.55);color:inherit;border-radius:2px;padding:0 1px}
  .act{display:flex;align-items:center;gap:10px}
  .sw{display:flex;align-items:center;gap:6px;cursor:pointer;font-size:12px;font-weight:600;color:var(--label2);letter-spacing:-.01em}
  .sw input{position:absolute;opacity:0;pointer-events:none}
  .sw i{position:relative;width:34px;height:20px;border-radius:10px;background:rgba(120,120,128,.16);transition:background .25s}
  .sw i::after{
    content:"";position:absolute;left:2px;top:2px;width:16px;height:16px;border-radius:50%;background:#fff;
    box-shadow:0 2px 4px rgba(0,0,0,.15),0 0 0 .5px rgba(0,0,0,.04);transition:transform .25s var(--ease);
  }
  .sw input:checked + i{background:#34c759}
  .sw input:checked + i::after{transform:translateX(14px)}
  .sw input:checked ~ span,.sw:has(input:checked) span{color:var(--label)}
  .sw input:focus-visible + i{outline:2px solid var(--tint);outline-offset:2px}

  .lb{
    position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;
    align-items:center;justify-content:center;padding:24px;cursor:zoom-out;z-index:9;
  }
  .lb.on{display:flex}
  .lb img{max-width:100%;max-height:100%;border-radius:14px}

  @media (max-width:560px){
    .win{border-radius:18px}
    .search{height:52px;padding:0 14px 0 16px}
    .search .term{font-size:19px}
    .sheet{padding:12px}
    .char{grid-template-columns:1fr}
    .pic{width:100%;min-height:0;aspect-ratio:4/3}
    .pic img{object-position:50% 20%}
  }
  .instant *, .instant body{transition:none!important}
  @media (prefers-reduced-motion:reduce){
    *{transition:none!important;animation:none!important}
  }
</style>
</head>
<body>

<div class="win">
  <div class="search">
    <svg width="17" height="17" viewBox="0 0 17 17" fill="none"><circle cx="7" cy="7" r="5.6" stroke="currentColor" stroke-width="2"/><path d="M11.2 11.2L15.5 15.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    <div class="term"><span class="ph">Search</span><span class="val" id="val"></span></div>
    <button class="clear" id="clear" type="button" aria-label="닫기">✕</button>
  </div>

  <div class="recent fold"><div>
    <div class="cap"><span>최근 검색어</span></div>
    <ul id="recent"></ul>
  </div></div>

  <div class="view fold"><div>
    <div class="sheet">
      <div class="subs" id="subs"></div>
      <div class="chars" id="chars"></div>
    </div>
  </div></div>
</div>

<div class="lb" id="lb"><img alt=""></div>

<script>
const MODELS = [
  { key:'v45f', label:'변연 V4.5F 프롬프트' },
  { key:'v5f',  label:'변연 V5F 프롬프트' },
];
const CATS = [
  { key:'base',   label:'기본' },
  { key:'summer', label:'사복-여름' },
  { key:'winter', label:'사복-겨울' },
];
const CHARS = [
  { key:'vance', label:'Dr. Vance', kr:'변정원', meta:'35Y · 186cm · 카키색 머리 · 회색 눈',
    ok:'부드럽게 웃는 표정, 무표정, 약간 찌푸린 표정, 황당한 표정, 상기된 표정, 뼈대만 굵은 슬렌더 체형',
    ng:'지나치게 고양이상 or 강아지상, 어려보이는 얼굴, 환하게 웃거나 우는 얼굴, 근육질, 키가 작음' },
  { key:'blanc', label:'Blanc', kr:'김연수', meta:'25Y · 162cm · 검은색 머리 · 네이비색 눈',
    ok:'장난스럽게 웃는 표정, 기세등등한 표정, 감정표현이 풍부한 얼굴, 아무튼 짧은 머리, 마른 체형',
    ng:'강아지상, 아련하거나 우아한 표정, 송곳니, 볼륨감 있는 몸매, 울프컷' },
];
const E = () => ({ img:'', prompt:'', negative:'' });
const DATA = {
  v45f:{
    base:  {
      vance:{
        img:'img/v45f-base-vance.jpg',
        prompt:`외형 boy, male, mature male, adult, broad shoulders, -0.5::muscular::, 1.2::dark khaki hair::, ::short hair, center certained hair, parted hair, voluminous hair, strands::, ::grey eyes, sharp eyes, thin eyes::, 0.5::narrow eyes::, thin eyebrows, -1::v-shaped eyebrows::, 0.5::bags under eyes::, grey-framed eyewear, semi-rimless eyewear, glasses,
의상 black turtleneck, white lab coats, long sleeves, white pants, black shoes
표정 expressionless, calm expression`,
        negative:`necklace, eyewear strap,`,
        alt:{
          label:'늙크크up',
          prompt:`외형 mature male, adult, toned male, aged up, broad shoulders, slender, -1::muscular::, 1.2::dark khaki hair::, ::short hair, center certained hair, parted hair, voluminous hair, strands::, ::grey eyes, sharp eyes, thin eyes::, 0.5::narrow eyes::, thin eyebrows, -1::v-shaped eyebrows::, 0.5::bags under eyes::, grey-framed eyewear, semi-rimless eyewear, glasses,
의상 black turtleneck, white lab coats, long sleeves, white pants, black shoes
표정 expressionless, calm expression`,
        },
      },
      blanc:{
        img:'img/v45f-base-blanc.jpg',
        prompt:`외형 girl, female, adult, mischief, slender, small breasts, ::black hair, bob cut, inward bob, wispy bangs, ahoge::, 0.5::voluminous hair::, thin eyebrows, navy blue eyes, tsurime, sharp eyes, round eyes,
의상 white shirt, dress shirt, black suspenders, black pants, white socks, black platform shoes
표정 naughty face, soft smile,`,
        negative:`earrings, necklace, necktie, thick eyebrows, pantyhose, 1.2::fang, sharp teeth::, hime cut, blunt cut, mullet hair, :3`,
      },
    },
    summer:{ vance:E(), blanc:E() },
    winter:{ vance:E(), blanc:E() },
  },
  v5f:{
    base:  {
      vance:{
        img:'img/v5f-base-vance.jpg',
        prompt:`외형 boy, mature male, broad shoulders, -0.5::muscular::, ::dark khaki hair, short hair, center certained hair, parted hair, strands::, 0.5::voluminous hair::, ::grey eyes, thin eyes::, 0.5::narrow eyes::, thin eyebrows, -0.5::v-shaped eyebrows::, 0.5::bags under eyes::, grey-framed eyewear, semi-rimless eyewear, glasses,
의상 black turtleneck, white lab coats, white pants, black shoes
표정 expressionless, calm expression`,
        negative:`necklace, eyewear strap, shota, `,
      },
      blanc:{
        img:'img/v5f-base-blanc.jpg',
        prompt:`외형 girl, female, mischief, slender, small breasts, ::black hair, bob cut, inward bob, wispy bangs, ahoge::, 0.5::voluminous hair::, thin eyebrows, navy blue eyes, tsurime, 0.5::sharp eyes, round eyes::,
의상 outer:white formal blazer, white shirt, dress shirt, black suspenders, black pants, white socks, black platform shoes
표정 naughty face, soft smile,`,
        negative:`earrings, necklace, necktie, thick eyebrows, pantyhose, fang, sharp teeth, hime cut, blunt cut, mullet hair, :3, 0.5::makeup::`,
      },
    },
    summer:{ vance:E(), blanc:E() },
    winter:{ vance:E(), blanc:E() },
  },
};

const $ = s => document.querySelector(s);
const esc = s => s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const label = (list, k) => list.find(x => x.key === k).label;
let model = null, cat = CATS[0].key;

const ICON = '<svg width="15" height="15" viewBox="0 0 17 17" fill="none"><circle cx="7" cy="7" r="5.6" stroke="currentColor" stroke-width="2"/><path d="M11.2 11.2L15.5 15.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>';
$('#recent').innerHTML = MODELS.map(m => `<li data-m="${m.key}">${ICON}${m.label}<span class="go">↖</span></li>`).join('');
$('#recent').onclick = e => { const li = e.target.closest('li'); if (li) open(li.dataset.m, CATS[0].key); };
$('#clear').onclick = close;

const TAGS = ['외형','의상','표정'];

const lines = t => t.split('\n').map(l => {
  const m = l.match(new RegExp(`^(${TAGS.join('|')})\\s+(.*)$`));
  return m ? {tag:m[1], text:m[2]} : {tag:'', text:l};
});
const plain = t => lines(t).map(l => l.text).join('\n');

function diffLine(text, base){
  const parts = text.split(/(,\s*)/);
  const a = parts.filter((_, i) => !(i % 2)).map(x => x.trim());
  const b = base == null ? [] : base.split(/,\s*/).map(x => x.trim());
  const L = Array.from({length:a.length + 1}, () => new Array(b.length + 1).fill(0));
  for (let i = a.length - 1; i >= 0; i--) for (let j = b.length - 1; j >= 0; j--)
    L[i][j] = a[i] === b[j] ? L[i+1][j+1] + 1 : Math.max(L[i+1][j], L[i][j+1]);
  const keep = new Set();
  for (let i = 0, j = 0; i < a.length && j < b.length;){
    if (a[i] === b[j]){ keep.add(i); i++; j++; }
    else if (L[i+1][j] >= L[i][j+1]) i++; else j++;
  }
  return parts.map((x, i) => (i % 2 || !x.trim() || keep.has(i / 2)) ? esc(x) : `<mark>${esc(x)}</mark>`).join('');
}

function body(text, base){
  if (!text) return '입력 전';
  const prev = base == null ? null : lines(base);
  return lines(text).map((l, i) => {
    let html = esc(l.text);
    if (prev){
      const same = prev.find(p => p.tag && p.tag === l.tag) || (!l.tag ? prev[i] : null);
      html = diffLine(l.text, same ? same.text : null);
    }
    return `<span class="ln">${l.tag ? `<i class="lt">${l.tag}</i>` : ''}<span>${html}</span></span>`;
  }).join('');
}

function block(kind, d, on){
  const title = kind === 'prompt' ? 'Prompt' : 'Negative';
  const alt = d.alt && (kind === 'prompt' || d.alt.negative != null) ? d.alt : null;
  const text = on && alt ? alt[kind] : d[kind];
  const base = on && alt ? d[kind] : null;
  const sw = kind === 'prompt' && d.alt
    ? `<label class="sw"><span>${esc(d.alt.label)}</span><input type="checkbox" ${on?'checked':''}><i></i></label>` : '';
  const look = kind === 'prompt' && text ? (lines(text).find(l => l.tag === '외형') || {}).text : '';
  const lookBtn = look ? `<button class="copy" type="button" data-p="${esc(look)}" data-l="외형만">외형만</button>` : '';
  return `<div class="block" data-kind="${kind}">
    <div class="bhead"><b>${title}</b><div class="act">${sw}${lookBtn}<button class="copy" type="button" data-p="${esc(text ? plain(text) : '')}" ${text?'':'disabled'}>복사</button></div></div>
    <pre class="prompt ${text?'':'empty'}">${body(text, base)}</pre>
  </div>`;
}
const altOn = {};
const blocks = (k, d) => block('prompt', d, altOn[k]) + block('negative', d, altOn[k]);

const filled = (m, c) => c === CATS[0].key ||
  Object.values(DATA[m][c]).some(d => d.prompt || d.negative || d.img);

function render(){
  $('#val').textContent = label(MODELS, model);
  $('#subs').innerHTML = CATS.map(c =>
    `<button type="button" data-k="${c.key}" class="${c.key===cat?'on':''}" ${filled(model, c.key)?'':'disabled'}>${c.label}</button>`).join('');
  const set = DATA[model][cat];
  $('#chars').innerHTML = CHARS.map(ch => {
    const d = set[ch.key] || E();
    return `<section class="char" data-k="${model}/${cat}/${ch.key}">
      <div class="pic">${d.img ? `<img src="${esc(d.img)}" alt="${ch.label}" draggable="false">` : '참고 사진'}</div>
      <div class="body">
        <div class="who">
          <div class="name">${ch.label} <small>(${ch.kr})</small></div>
          <div class="meta">${ch.meta}</div>
          <ul class="note">
            <li><b class="ok">OK</b><span>${ch.ok}</span></li>
            <li><b class="ng">NG</b><span>${ch.ng}</span></li>
          </ul>
        </div>
        <div class="blocks">${blocks(`${model}/${cat}/${ch.key}`, d)}</div>
      </div>
    </section>`;
  }).join('');
  const el = $('#chars'); el.classList.remove('swap'); void el.offsetWidth; el.classList.add('swap');
}

function open(m, c){
  model = m; cat = c;
  render();
  document.body.classList.add('open');
  history.replaceState(null, '', `#${model}/${cat}`);
}
function close(){
  document.body.classList.remove('open');
  history.replaceState(null, '', location.pathname);
}

$('#subs').onclick = e => { const b = e.target.closest('button'); if (b && !b.disabled) open(model, b.dataset.k); };
document.addEventListener('dragstart', e => e.preventDefault());

$('#chars').addEventListener('click', e => {
  const b = e.target.closest('.copy');
  if (b && !b.disabled){
    navigator.clipboard.writeText(b.dataset.p).then(() => {
      b.textContent = '복사됨'; b.classList.add('done');
      setTimeout(() => { b.textContent = b.dataset.l || '복사'; b.classList.remove('done'); }, 1200);
    });
  }
  const img = e.target.closest('.pic img');
  if (img){ $('#lb img').src = img.src; $('#lb').classList.add('on'); }
});
$('#chars').addEventListener('change', e => {
  if (!e.target.closest('.sw')) return;
  const sec = e.target.closest('.char'), k = sec.dataset.k, [m, c, ch] = k.split('/');
  altOn[k] = e.target.checked;
  sec.querySelector('.blocks').innerHTML = blocks(k, DATA[m][c][ch]);
});
$('#lb').onclick = () => $('#lb').classList.remove('on');

const [hm, hc] = location.hash.slice(1).split('/');
if (MODELS.some(x => x.key === hm)){
  document.documentElement.classList.add('instant');
  open(hm, CATS.some(x => x.key === hc) && filled(hm, hc) ? hc : CATS[0].key);
  requestAnimationFrame(() => requestAnimationFrame(() => document.documentElement.classList.remove('instant')));
}
</script>
</body>
</html>
