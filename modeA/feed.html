<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LIMBIC · FEED</title>
<!--
  모드 A 관제실 위젯 — 한 파일을 ?w= 로 나눠 쓴다. vance.love 에 올려 luvlog HTML 위젯에 iframe 으로 넣는다.
    ?w=main                 메인 뷰포트 (헤더 위 띠) — 창 너머 감시 화면 · 탐색 박스 → 인물 고정 · 클릭 프로필
    ?w=cam&cam=1&n=3        CCTV — 접속마다 n 대 중 한 대에만 인물. 가까이 갈수록 선명, 고정된 인물 클릭 → 돌아봄 + 말풍선
    ?w=signal&n=3           신호 — 동그라미 3개 + 캠 궤도도 + 경고문. 들키면 빨간 ALERT
    ?w=graph                실시간 그래프 — 들키면 빨간 스파이크
  위젯끼리는 BroadcastChannel('limbic-a') 로 신호를 주고받는다 (같은 vance.love 출처 iframe 끼리만).
  디버그: &force=1 (이 캠에 인물) &look=1 (돌아본 상태) &aware=1 (빨간 경보) &mx=50&my=40 (마우스 위치 % 고정) &who=blanc[&pop=1]
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+KR:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --g:#39ff14; --r:#ff2a3a; --y:#ffd21f;
    --w:#eef0ea; --w6:rgba(238,240,234,.6); --w4:rgba(238,240,234,.4); --w2:rgba(238,240,234,.2); --w1:rgba(238,240,234,.1);
    --bg:#050605;
    --sa:'Inter Tight',sans-serif; --mo:'IBM Plex Mono',ui-monospace,monospace; --ko:'IBM Plex Sans KR',sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:var(--bg);overflow:hidden;color:var(--w);font-family:var(--mo)}
  body{-webkit-font-smoothing:antialiased;user-select:none}
  .w{position:relative;width:100%;height:100%;overflow:hidden}
  .mono{font:400 9px/1.4 var(--mo);letter-spacing:.14em;text-transform:uppercase}
  .dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--g);box-shadow:0 0 6px var(--g);vertical-align:1px;margin-right:7px}
  .dot.r{background:var(--r);box-shadow:0 0 6px var(--r);animation:blink 1.2s steps(1) infinite}
  @keyframes blink{50%{opacity:.15}}
  .abs{position:absolute;z-index:6;pointer-events:none}

  /* 감지 박스 — 탐색(흰 꺾쇠)이 마우스를 따라다니다 인물에 끌려가 초록으로 고정 */
  .tgt{position:absolute;z-index:7;pointer-events:none;opacity:0;transition:opacity .15s;--c:var(--w6);--k:8px;--t:1px}
  .tgt.on{opacity:1}
  .tgt::before{content:"";position:absolute;inset:0;
    background:
      linear-gradient(var(--c),var(--c)) 0 0/var(--k) var(--t), linear-gradient(var(--c),var(--c)) 0 0/var(--t) var(--k),
      linear-gradient(var(--c),var(--c)) 100% 0/var(--k) var(--t), linear-gradient(var(--c),var(--c)) 100% 0/var(--t) var(--k),
      linear-gradient(var(--c),var(--c)) 0 100%/var(--k) var(--t), linear-gradient(var(--c),var(--c)) 0 100%/var(--t) var(--k),
      linear-gradient(var(--c),var(--c)) 100% 100%/var(--k) var(--t), linear-gradient(var(--c),var(--c)) 100% 100%/var(--t) var(--k);
    background-repeat:no-repeat}
  .tgt::after{content:"";position:absolute;left:50%;top:50%;width:7px;height:7px;transform:translate(-50%,-50%);
    background:linear-gradient(var(--c),var(--c)) 50% 0/1px 100% no-repeat,linear-gradient(var(--c),var(--c)) 0 50%/100% 1px no-repeat}
  .tgt.lock{--c:var(--g);--k:14px;--t:1.5px}
  .tgt.lock::before{outline:1px solid rgba(57,255,20,.25);outline-offset:-1px}
  .tgt.red{--c:var(--r)}
  /* 이름표 = 박스 왼쪽 위 바깥 / 보조 글자(SUBJECT · CONF) = 박스 오른쪽 아래 바깥. 자리가 없을 때만 반대편(역시 바깥)으로 */
  .tag{position:absolute;left:0;bottom:calc(100% + 5px);white-space:nowrap}
  .tgt.in .tag{bottom:auto;top:calc(100% + 5px)}
  .meta{position:absolute;right:0;top:calc(100% + 5px);display:flex;flex-direction:column;align-items:flex-end;gap:4px;white-space:nowrap}
  .tgt.bt .meta{top:auto;bottom:calc(100% + 5px);flex-direction:column-reverse}
  .tag b{font:400 9px/1 var(--mo);letter-spacing:.16em;color:var(--c);text-shadow:0 0 3px #000,0 1px 2px #000}
  .tgt.lock .tag b,.tgt.red .tag b{font:600 10.5px/1 var(--sa);letter-spacing:.06em;background:var(--c);color:#000;padding:3px 6px 3px;text-shadow:none;display:inline-block}
  .tgt.red .tag b{color:#fff}
  .meta small,.meta .cf{font:400 8.5px/1 var(--mo);letter-spacing:.14em;color:var(--c);text-shadow:0 0 3px #000,0 1px 2px #000,0 0 6px rgba(0,0,0,.8)}
  .meta small:empty,.tgt.red .cf{display:none}

  /* ── MAIN · 창 너머 감시 화면 ───────────────────────── */
  .mon{background:#030303;cursor:crosshair}
  .out{position:absolute;z-index:2;color:var(--w4)}
  .win{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(80%,1120px);height:84%;border-radius:clamp(26px,4.6vw,64px);overflow:hidden;background:#000;
    box-shadow:0 0 0 9px #0b0c0b,0 0 0 10px rgba(238,240,234,.07),0 40px 90px rgba(0,0,0,.9);transition:box-shadow .3s}
  .mon.aw .win{box-shadow:0 0 0 9px #0b0c0b,0 0 0 10px rgba(255,42,58,.6),0 0 60px rgba(255,42,58,.25)}
  .win::after{content:"";position:absolute;inset:0;z-index:5;border-radius:inherit;pointer-events:none;box-shadow:inset 0 0 90px rgba(0,0,0,.85),inset 0 0 0 1px rgba(238,240,234,.08)}
  .feed{position:absolute;inset:0;transition:filter .6s}
  .feed img{width:100%;height:100%;object-fit:cover;object-position:50% 22%;display:block;filter:grayscale(.92) contrast(1.08) brightness(.66)}
  .feed::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(40,70,72,.35),transparent 45%,rgba(0,0,0,.55))}
  .mon:not(.live) .feed{filter:blur(10px) brightness(.8)}
  /* HUD — 위에서부터 차례로 쌓는 구조(글자가 커지면 선이 밀려남 → 겹치지 않음). 글자 크기는 창 폭·높이 중 작은 쪽 기준 */
  .hud{position:absolute;inset:0;z-index:6;pointer-events:none;display:flex;flex-direction:column;padding:4.6% 7% 5%}
  .h-top{display:flex;flex-direction:column}
  .compass{position:relative;align-self:center;width:44%;text-align:center;margin-bottom:clamp(6px,2.2vh,16px)}
  .compass .k{position:relative;height:9px;margin-top:5px;background:repeating-linear-gradient(90deg,var(--w4) 0 1px,transparent 1px 8px) 0 100%/100% 4px no-repeat,repeating-linear-gradient(90deg,var(--w) 0 1px,transparent 1px 40px) 0 100%/100% 9px no-repeat}
  .compass .k::after{content:"";position:absolute;left:50%;bottom:-9px;width:0;height:0;border:4px solid transparent;border-top-color:var(--w);transform:translateX(-50%)}
  .compass .l{display:flex;justify-content:space-between;margin-top:4px;color:var(--w6)}
  .h-row{display:flex;justify-content:space-between;align-items:flex-end;gap:16px}
  .rule{height:1px;background:var(--w2);flex:none}
  .h-top .rule{margin-top:clamp(6px,1.6vh,12px)}
  .lbl{margin-top:6px;color:var(--w6)}
  .big{font:500 clamp(22px,min(4vw,8.6vh),54px)/1 var(--sa);letter-spacing:-.02em}
  .name{font:500 clamp(28px,min(5.6vw,11.5vh),78px)/.95 var(--sa);letter-spacing:-.03em;transition:color .2s}
  .name em{font:500 8.5px/1 var(--mo);font-style:normal;letter-spacing:.14em;background:var(--g);color:#000;padding:2px 5px;margin-left:10px;vertical-align:middle;position:relative;top:-.6em}
  .mon.aw .name em{background:var(--r);color:#fff}
  .route{margin-top:clamp(6px,1.4vh,10px);color:var(--w6)}
  .wave{position:relative;height:clamp(14px,5vh,36px);margin-top:clamp(6px,1.6vh,12px)}
  .wave canvas{width:100%;height:100%;display:block}
  /* 가운데 — 남는 높이를 차지하는 빈 여백 */
  .mid{flex:1;min-height:24px}
  .h-bot{display:grid;grid-template-columns:1fr auto;grid-template-areas:"nm nm" "rl rl" "dd dt";align-items:end}
  .h-bot .nmw{grid-area:nm;min-width:0}
  .h-bot > .rule{grid-area:rl;margin:clamp(8px,2.2vh,18px) 0 clamp(8px,2vh,16px)}
  .h-bot .dd{grid-area:dd}
  .h-bot .dt{grid-area:dt}
  .dt{display:grid;grid-template-columns:auto auto auto auto;gap:5px 18px;align-items:baseline}
  .dt dt{color:var(--w4)} .dt dd{color:var(--w);text-align:right}
  .dt dd.on{background:var(--w);color:#000;padding:0 4px}
  .alert{position:absolute;left:50%;top:5%;transform:translateX(-50%);opacity:0;color:var(--r);transition:opacity .2s}
  .mon.aw .alert{opacity:1}
  .subj b{display:block;font:500 18px/1.2 var(--sa);letter-spacing:0;transition:font-size .4s}
  .big,.name{text-shadow:0 1px 3px rgba(0,0,0,.4)}

  /* 호버(live) — 장식 줄은 접혀 사라지고, 시계는 위 · 이름은 맨 아래로 작게 */
  .fx{transition:opacity .3s,max-height .4s cubic-bezier(.2,.8,.2,1),margin .4s cubic-bezier(.2,.8,.2,1);max-height:90px}
  .big,.name{transition:font-size .4s cubic-bezier(.2,.8,.2,1),color .2s}
  .mon.live .fx,.mon.aw .compass{opacity:0}
  .mon.live .h-top .fx,.mon.live .h-bot .fx{max-height:0;margin-top:0;margin-bottom:0;overflow:hidden}
  .mon.live .big{font-size:15px}
  .mon.live .subj b{font-size:11px;font-weight:400;font-family:var(--mo);letter-spacing:.12em;text-transform:uppercase;color:var(--w6)}
  .mon.live .name{font-size:19px;letter-spacing:-.01em}
  .mon.live .name em{top:-.15em;margin-left:8px}
  .mon.live .h-bot{grid-template-areas:"nm dt"}
  .mon.live .h-bot .dd{display:none}
  .mon.live .dt{gap:3px 14px;opacity:.8}

  .mon.aw .alert{opacity:1}
  .card{position:absolute;right:2.2%;bottom:5%;z-index:3;width:118px;border:1px solid var(--w2);background:#050605;color:var(--w6);font:400 8px/1 var(--mo);letter-spacing:.1em}
  .card div{display:flex;justify-content:space-between;padding:5px 7px;border-bottom:1px solid var(--w1)}
  .card b{font:500 22px/1 var(--sa);color:var(--w);letter-spacing:-.02em}
  .card .bc{height:16px;margin:6px 7px;background:repeating-linear-gradient(90deg,var(--w6) 0 1px,transparent 1px 3px,var(--w6) 3px 5px,transparent 5px 6px,var(--w6) 6px 6.5px,transparent 6.5px 9px)}
  /* 클릭 팝업 — 여러 조각의 유리: 탭·원형 홈·옆 홈이 있는 본체 + 초록 틴트 판 + 회전 배지 + 알약 태그 */
  .pop{position:absolute;z-index:9;top:50%;width:320px;height:350px;transform:translate(0,-46%) scale(calc(var(--s) * .97));opacity:0;pointer-events:none;
    transition:opacity .22s,transform .3s cubic-bezier(.2,.8,.2,1);color:var(--w)}
  .pop{--s:1;transform-origin:0 50%}
  .pop.on{opacity:1;pointer-events:auto;transform:translate(0,-50%) scale(var(--s))}
  .gl{position:absolute;-webkit-backdrop-filter:blur(20px) saturate(160%);backdrop-filter:blur(20px) saturate(160%)}
  .gl-main{inset:0;background:linear-gradient(140deg,rgba(255,255,255,.2),rgba(255,255,255,.06) 48%,rgba(255,255,255,.1))}
  .gl-main::before{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(118deg,rgba(255,255,255,.2),transparent 30%)}
  .gl-edge{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible;z-index:3}
  .gl-edge path{fill:none;stroke:rgba(255,255,255,.45);stroke-width:1}
  .gl-tint{left:-30px;top:118px;width:64px;display:flex;align-items:center;padding:20px 0 20px 9px;border-radius:14px;background:linear-gradient(160deg,rgba(57,255,20,.32),rgba(57,255,20,.1));
    border:1px solid rgba(57,255,20,.55);box-shadow:inset 0 1px 0 rgba(255,255,255,.3)}
  .gl-tint span{writing-mode:vertical-rl;transform:rotate(180deg);color:rgba(220,255,210,.9);line-height:1;letter-spacing:.18em}
  .gl-badge{right:-18px;top:-16px;width:92px;height:92px;border-radius:50%;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.4);z-index:4;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.4),0 10px 30px rgba(0,0,0,.35)}
  .gl-badge svg{width:100%;height:100%;animation:spin 16s linear infinite}
  .gl-badge text{font:500 7.6px var(--mo);letter-spacing:.2em;fill:rgba(255,255,255,.85)}
  .gl-badge{pointer-events:auto}
  .gl-badge .bx{all:unset;position:absolute;left:50%;top:50%;width:34px;height:34px;margin:-17px 0 0 -17px;border:1.5px solid var(--w);border-radius:50%;cursor:pointer;
    display:grid;place-items:center;font:400 13px/1 var(--mo);color:var(--w);transition:background .15s,transform .2s}
  .gl-badge .bx:hover{background:rgba(255,255,255,.22);transform:rotate(90deg)}
  .gl-badge b{position:absolute;right:16px;top:16px;width:8px;height:8px;border-radius:50%;background:var(--r);box-shadow:0 0 8px var(--r)}
  .gl-pill{right:26px;bottom:-17px;height:34px;padding:0 14px;display:flex;align-items:center;gap:12px;border-radius:999px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.4);z-index:4;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.4),0 10px 24px rgba(0,0,0,.35);color:rgba(255,255,255,.85)}
  .gl-pill i{width:62px;height:14px;background:repeating-linear-gradient(90deg,rgba(255,255,255,.8) 0 1px,transparent 1px 3px,rgba(255,255,255,.8) 3px 5px,transparent 5px 6px,rgba(255,255,255,.8) 6px 6.5px,transparent 6.5px 9px)}
  .pc{position:absolute;inset:0;z-index:2}
  .g-hd{position:absolute;left:14px;top:0;width:150px;height:26px;display:flex;align-items:center;color:rgba(255,255,255,.85);white-space:nowrap}
  /* 카드 안 — 왼쪽: 큰 사진 + 번호 / 오른쪽: 이름 · 소속 · 정보 */
  .px{all:unset;pointer-events:auto;cursor:pointer;width:18px;height:18px;margin-left:8px;border-radius:50%;border:1px solid rgba(255,255,255,.5);display:grid;place-items:center;font:400 9px/1 var(--mo);color:var(--w)}
  .px:hover{background:rgba(255,255,255,.18)}
  .pf{position:absolute;left:18px;top:44px;width:106px;height:244px;border-radius:14px;background-size:cover;background-position:50% 18%;filter:grayscale(1) contrast(1.08);box-shadow:0 0 0 1px rgba(255,255,255,.35)}
  .pf::after{content:"";position:absolute;inset:6px;border-radius:9px;pointer-events:none;
    background:linear-gradient(var(--w),var(--w)) 0 0/8px 1px,linear-gradient(var(--w),var(--w)) 0 0/1px 8px,linear-gradient(var(--w),var(--w)) 100% 0/8px 1px,linear-gradient(var(--w),var(--w)) 100% 0/1px 8px,
      linear-gradient(var(--w),var(--w)) 0 100%/8px 1px,linear-gradient(var(--w),var(--w)) 0 100%/1px 8px,linear-gradient(var(--w),var(--w)) 100% 100%/8px 1px,linear-gradient(var(--w),var(--w)) 100% 100%/1px 8px;background-repeat:no-repeat;opacity:.8}
  .g-id{position:absolute;left:18px;top:204px;width:106px}
  .g-id small{display:block;margin-bottom:5px;color:rgba(255,255,255,.6)}
  .g-id b{display:block;font:500 46px/.9 var(--sa);letter-spacing:-.04em}
  .g-cls{position:absolute;left:140px;top:44px;background:var(--r);color:#fff;padding:3px 6px;letter-spacing:.14em}
  .pb{position:absolute;left:140px;right:18px;top:96px}
  .pb h3{font:500 27px/1 var(--sa);letter-spacing:-.03em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .pb .kr{font:500 10px/1.3 var(--mo);letter-spacing:.12em;text-transform:uppercase;color:rgba(255,255,255,.7);margin:7px 0 0;padding-bottom:12px;border-bottom:1px solid rgba(255,255,255,.22)}
  .pb dl{display:grid;grid-template-columns:auto 1fr;gap:7px 10px;margin-top:12px;letter-spacing:.05em}
  .pb dt{color:rgba(255,255,255,.55)} .pb dd{color:var(--w);min-width:0;overflow-wrap:anywhere}
  .pb dd.gg{color:var(--g)}
  .haz{position:absolute;left:140px;right:24px;bottom:34px;height:11px;background:repeating-linear-gradient(-45deg,rgba(255,255,255,.85) 0 6px,transparent 6px 12px);border-radius:2px}
  .g-hd .px{display:none}
  /* 좁은 화면에서도 배지 · 틴트 판은 유지 — 팝업 전체가 --s 로 축소됨 */
  .wire{position:absolute;inset:0;z-index:8;pointer-events:none;width:100%;height:100%;opacity:0;transition:opacity .25s}
  .wire.on{opacity:1}
  .wire path{fill:none;stroke:rgba(238,240,234,.75);stroke-width:1}
  .wire circle{fill:#000;stroke:var(--w);stroke-width:1.2}
  .wire rect{fill:var(--w)}
  @media (max-width:1180px){ .card{display:none} }
  /* 낮은 창 — 장식(나침반 · 파형)을 빼서 가운데 여백 확보 */
  @media (max-height:640px){ .compass{display:none} }
  @media (max-height:420px){ .lbl,.route{display:none} }
  @media (max-width:760px){
    .win{width:94%;height:88%}
    .wave,.compass,.card,.dt,.hide-s,.out{display:none}
    .hud{padding:6% 6% 6%}
  }

  /* ── CAM ───────────────────────── */
  .cam{background:#000;cursor:crosshair}
  .cam canvas{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated}
  .cam.hot{cursor:pointer}
  .cam::before{content:"";position:absolute;inset:0;z-index:4;pointer-events:none;background:radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,.65)),repeating-linear-gradient(0deg,rgba(0,0,0,.22) 0 1px,transparent 1px 3px)}
  .c-hd{position:absolute;z-index:6;left:12px;right:12px;top:10px;display:flex;justify-content:space-between;align-items:baseline;pointer-events:none}
  .c-hd b{font:500 13px/1 var(--sa);letter-spacing:.02em}
  .c-hd .mono{color:var(--w6)}
  .c-ft{position:absolute;z-index:6;left:12px;right:12px;bottom:10px;display:flex;justify-content:space-between;pointer-events:none;color:var(--w6)}
  .c-ft .st{color:var(--w)}
  .cam.glitch canvas{animation:gl .5s steps(2) 3}
  .cam.glitch .st{color:var(--r)}
  @keyframes gl{0%{transform:translate(0)}25%{transform:translate(-6px,2px) skewX(6deg);filter:invert(.12)}50%{transform:translate(4px,-1px)}75%{transform:translate(-2px,0) skewX(-4deg)}}
  .cam.look::after{content:"";position:absolute;inset:0;z-index:5;pointer-events:none;box-shadow:inset 0 0 0 1.5px var(--r),inset 0 0 50px rgba(255,42,58,.25)}
  /* 대사 — 블랑은 말풍선, 닥터 밴스는 오른쪽 관찰자 답 */
  .bub{position:absolute;z-index:8;left:7%;right:7%;bottom:78px;opacity:0;transform:translateY(8px);transition:opacity .2s,transform .25s cubic-bezier(.2,.8,.2,1);pointer-events:none}
  .cam.talk .bub{opacity:1;transform:none}
  .bub .bh{color:var(--w6);margin-bottom:6px}
  .cam.look .bub .bh{color:var(--r)}
  .bub .log{display:flex;flex-direction:column;gap:10px}
  .bub .ln{max-width:88%;align-self:flex-start;animation:ln-in .25s cubic-bezier(.2,.8,.2,1)}
  @keyframes ln-in{from{opacity:0;transform:translateY(6px)}}

<script>
/* ===== 공통 ===== */
const Q = new URLSearchParams(location.search);
const W = Q.get('w') || 'cam', N = +Q.get('n') || 3;
const CH = 'BroadcastChannel' in window ? new BroadcastChannel('limbic-a') : null;
const send = m => { try{ CH && CH.postMessage(m); }catch(e){} };
const on = fn => CH && CH.addEventListener('message', e => fn(e.data || {}));
const KEY = 'limbicA';
/* 페이지를 열 때마다 새로 뽑음 — 같은 순간(8초 안)에 뜬 iframe 끼리는 같은 값을 공유 */
function pick(){
  let s = {}; try{ s = JSON.parse(localStorage.getItem(KEY)) || {}; }catch(e){}
  const now = Date.now();
  if (s.pick >= 1 && s.pick <= N && now - s.t < 3000) return s.pick;   // 같은 접속에서 동시에 뜬 위젯끼리만 공유
  /* 캠별 등장 비율 — CAM 1 · 2 를 조금 더 자주 (40 : 40 : 20) */
  const WT = { 1:4, 2:4, 3:2 }, ws = Array.from({ length:N }, (_, i) => WT[i+1] || 2), sum = ws.reduce((a,b) => a + b, 0);
  let r = Math.random() * sum, p = 1;
  for (let i = 0; i < N; i++){ r -= ws[i]; if (r < 0){ p = i + 1; break; } }
  try{ localStorage.setItem(KEY, JSON.stringify({ pick:p, t:now })); }catch(e){}
  return p;
}
const pad = (n, k = 2) => String(n).padStart(k, '0');
const clock = (s = true) => { const d = new Date(); return `${pad(d.getHours())}:${pad(d.getMinutes())}` + (s ? `:${pad(d.getSeconds())}` : ''); };
const AWARE_MS = 6500;
const SINCE = new Date(2026, 1, 12);
const dplus = () => 'D+' + Math.floor((Date.now() - SINCE) / 864e5);
</script>

<script>
document.body.appendChild(document.getElementById('t-' + W).content.cloneNode(true));

/* 이미지 object-fit:cover 좌표 변환 — 이미지 % → 화면 px */
function coverMap(iw, ih, W, H, px = .5, py = .5){
  const s = Math.max(W / iw, H / ih), dw = iw * s, dh = ih * s;
  const ox = (W - dw) * px, oy = (H - dh) * py;
  return { s, ox, oy, dw, dh, x: v => ox + v / 100 * dw, y: v => oy + v / 100 * dh };
}

/* ===== 탐색 박스 =====
   마우스를 바짝 따라다니는 작은 탐색 박스 → 인물 영역에 가까워질수록 그 인물 박스 쪽으로 끌려가 크기·위치가 맞춰지고,
   충분히 가까우면 고정(lock). subjects() = [{rect:[l,t,r,b] px, name, sub}] */
function Tracker(root, T, subjects, onLock){
  const s = { mx:-1, my:-1, x:0, y:0, w:0, h:0, init:false, lock:null, hold:null, k:0 };
  const nm = T.querySelector('.nm,#nm'), sb = T.querySelector('.sb,#sb'), cf = T.querySelector('.cf');
  const setPt = e => { const r = root.getBoundingClientRect(); s.mx = e.clientX - r.left; s.my = e.clientY - r.top; };
  root.addEventListener('pointermove', setPt);
  root.addEventListener('pointerdown', setPt);
  root.addEventListener('pointerleave', e => { if (e.pointerType === 'mouse') s.mx = s.my = -1; });
  const ss = v => v * v * (3 - 2 * v);
  function frame(){
    requestAnimationFrame(frame);
    const Wd = root.clientWidth, Ht = root.clientHeight, S = Math.min(Wd, Ht);
    let tg, best = null, bk = 0;
    if (s.hold){ tg = s.hold.rect; best = s.hold; bk = 1; }
    else if (s.mx < 0){
      T.classList.remove('on'); s.init = false;
      if (s.lock){ s.lock = null; onLock && onLock(null); }
      return;
    } else {
      const cs = Math.max(36, S * .13);
      const cur = [s.mx - cs/2, s.my - cs/2, s.mx + cs/2, s.my + cs/2];
      for (const p of subjects()){
        const [l,t,r,b] = p.rect;
        const dx = Math.max(l - s.mx, 0, s.mx - r), dy = Math.max(t - s.my, 0, s.my - b);
        const k = (!dx && !dy) ? 1 : ss(Math.max(0, 1 - Math.hypot(dx, dy) / (S * .22)));
        if (k > bk){ bk = k; best = p; }
      }
      const e = bk ? Math.pow(bk, 1.6) : 0;
      tg = best ? cur.map((v, i) => v + (best.rect[i] - v) * e) : cur;
    }
    if (!s.init){ s.x = tg[0]; s.y = tg[1]; s.w = tg[2]-tg[0]; s.h = tg[3]-tg[1]; s.init = true; }
    const ease = bk > .9 ? .2 : .42;
    s.x += (tg[0] - s.x) * ease; s.y += (tg[1] - s.y) * ease;
    s.w += ((tg[2]-tg[0]) - s.w) * ease; s.h += ((tg[3]-tg[1]) - s.h) * ease;
    const q = v => Math.round(v / 2) * 2;  // 2px 격자로 끊어서 기계적으로
    const jit = bk < .5 ? (Math.random() - .5) * 2 : 0;
    const top = +root.dataset.top || 4, y0 = Math.max(top, s.y), x0 = Math.max(4, s.x);
    Object.assign(T.style, { left:q(x0 + jit)+'px', top:q(y0)+'px', width:q(Math.min(s.w, Wd - x0 - 4))+'px', height:q(Math.min(s.h - (y0 - s.y), Ht - y0 - 4))+'px' });
    T.classList.add('on');
    const bh = Math.min(s.h - (y0 - s.y), Ht - y0 - 4);
    T.classList.toggle('in', y0 < 26);                 // 위에 이름표 자리 없음 → 아래로
    T.classList.toggle('bt', y0 + bh + 34 > Ht);       // 아래에 보조 글자 자리 없음 → 위로
    s.k = bk;
    const locked = bk > .88 ? best : null;
    T.classList.toggle('lock', !!locked);
    if (locked !== s.lock){ s.lock = locked; onLock && onLock(locked); }
    if (locked){ nm.textContent = locked.name; sb.textContent = locked.sub; cf.textContent = 'CONF ' + (96 + bk * 3.9).toFixed(1) + '%'; }
    else {
      nm.textContent = best && bk > .15 ? 'ACQUIRING ' + Math.round(bk * 100) + '%' : 'SCANNING';
      sb.textContent = ''; cf.textContent = `X${pad(Math.round(s.mx), 4)} Y${pad(Math.round(s.my), 4)}`;
    }
  }
  requestAnimationFrame(frame);
  if (Q.get('mx')) setTimeout(() => { s.mx = +Q.get('mx') / 100 * root.clientWidth; s.my = +Q.get('my') / 100 * root.clientHeight; }, 300);
  return s;
}

  (function shape(){

    /* clip-path 는 뒤 블러(backdrop-filter)를 못 자르므로 mask 로 자름 → 테두리 바깥은 완전히 빔 */
    const m = `url("data:image/svg+xml,${encodeURIComponent(`<svg xmlns='http://www.w3.org/2000/svg' width='${w}' height='${h}' viewBox='0 0 ${w} ${h}'><path d='${d}'/></svg>`)}") 0 0/100% 100% no-repeat`;

    $('#pd').innerHTML = Object.entries(p.rows).map(([k,v]) => `<dt>${k}</dt><dd${k === 'MATCH' ? ' class="gg"' : ''}>${v}</dd>`).join('');
    const [l,,r] = rectOf(p), WW = win.clientWidth, HH = win.clientHeight, narrow = WW < 600;

    tr.hold = p; nameSet(p); pop.classList.add('on'); send({ t:'id', who:p.name.toUpperCase() });
    if (win.clientWidth >= 600) requestAnimationFrame(() => wire(p)); else $('#wire').classList.remove('on');
  }
  const closePop = () => { pop.classList.remove('on'); $('#wire').classList.remove('on'); tr.hold = null; };
  win.addEventListener('click', e => {

  });
  $('#px').onclick = $('#bx').onclick = e => { e.stopPropagation(); closePop(); };
  let at;
  on(m => {
    if (m.t === 'aware'){ mon.classList.add('aw'); $('#alt').textContent = `SUBJECT AWARE · CAM-${pad(m.cam)}`; $('#sg').textContent = 'ALERT'; clearTimeout(at); at = setTimeout(() => { mon.classList.remove('aw'); $('#sg').textContent = 'STABLE'; }, AWARE_MS + 200); }

  /* 고도 그래프 같은 가는 파형 */

      const bh = Math.max(1, a * h); wg.fillRect(x, (h - bh)/2, Math.max(1, w/600), bh);

  if (Q.get('aware')) setTimeout(() => { mon.classList.add('aw'); $('#alt').textContent = 'SUBJECT AWARE · CAM-01'; }, 300);
}

/* ================= CAM ================= */
const PLACES = { 1:'BLANC ROOM', 2:'CORRIDOR B-2', 3:'TRAINING ROOM' };
/* 캠별 이미지 풀 — 접속할 때마다 하나를 뽑음.
   a = 평소, b = 클릭 후(없으면 클릭해도 대사 없음), e = 같은 장면의 빈 공간(인물이 없는 캠에 뜸 — 8 은 짝이 없어 7 의 빈 공간 사용). box = 얼굴(머리) 영역(이미지 %) [좌,위,우,아래] — 감지 박스 · 화면 가운데 맞춤 기준
   대사: 'B' = 블랑(말풍선), 'V' = 닥터 밴스(관찰자 답) */
const POOL = { 1:['1','2'], 2:['3','4','6'], 3:['7','8'] };
const SHOTS = {

        pre:[['B','......']],
        post:[['B','잠깐, 정원 씨 또 CCTV 보고 있죠?'],['B','저 방금 훈련 끝나서 게임하는 거예요.'],['B','잔소리 금지.'],['V','...알고 있습니다.'],['V','아무 말도 안 했습니다만.']] },
  '2':{ a:'img/cam/2-1.jpg', e:'img/cam/e2.jpg', b:'img/cam/2-2.jpg', box:[19,29,36,46],
        pre:[['B','아싸. 좋은 무기 나왔다.']],
        post:[['B','정원 씨, 언제 와요?']] },
  '3':{ a:'img/cam/3.jpg', e:'img/cam/e3.jpg', box:[48,25,59,39] },
  '4':{ a:'img/cam/4.jpg', e:'img/cam/e4.jpg', box:[54,15,70,36] },
  '6':{ a:'img/cam/6-1.jpg', e:'img/cam/e6.jpg', b:'img/cam/6-2.jpg', box:[39,12,58,33],
        pre:[['B','......']],

};
const pickShot = n => { const p = POOL[n] || POOL[1], f = Q.get('shot' + n); return SHOTS[f && p.includes(f) ? f : p[Math.floor(Math.random() * p.length)]]; };

const CAM_HTML = `<canvas></canvas>
  <div class="tgt"><div class="tag"><b class="nm"></b></div><div class="meta"><small class="sb"></small><span class="cf"></span></div></div>
  <div class="bub"><div class="bh mono">● audio intercept</div><div class="log"></div></div>
  <div class="c-hd"><b><span class="dot r"></span>CAM-<span class="cn">00</span></b><span class="mono clk">--:--:--</span></div>
  <div class="c-ft mono"><span class="place">—</span><span class="st">NO MOTION</span></div>`;

/* 캠 한 대 — root 안에 그림. opt.canLook() 이 false 면 클릭해도 반응 없음(작은 타일일 때), opt.big() 이면 평소 대사 표시 */
function Cam(root, camN, shot, opt = {}){
  root.innerHTML = CAM_HTML; root.dataset.top = 50;
  const q = s => root.querySelector(s);
  const has = !opt.empty, talk = !!(has && shot.b);
  const cv = q('canvas'), ctx = cv.getContext('2d'), T = q('.tgt');
  const sm = document.createElement('canvas'), sx = sm.getContext('2d', { willReadFrequently:true });
  q('.cn').textContent = pad(camN); q('.place').textContent = PLACES[camN] || 'ZONE ' + camN;
  const imgs = {};
  const srcs = has ? { a:shot.a, b:shot.b } : { a:shot.e };
  for (const k in srcs) if (srcs[k]){ const i = new Image(); i.src = srcs[k]; imgs[k] = i; i.onload = () => fit(); }
  let look = false, block = 14, map = null;
  const idleSt = () => has ? 'MOTION · 1 SUBJECT' : 'NO MOTION';
  q('.st').textContent = idleSt();
  const cur = () => imgs[look && imgs.b ? 'b' : 'a'];

  /* 인물이 화면 가운데 오도록 — 보이는 비율에 맞춰 잘라낼 위치 계산 */
  /* 이미지 아래 5% 는 잘라 씀 (생성 이미지 워터마크 자리) */
  const CROP = .95, ih = im => im.naturalHeight * CROP;
  function mapFor(im, W0, H0){
    const s = Math.max(W0 / im.naturalWidth, H0 / ih(im)), vw = W0 / (im.naturalWidth * s), vh = H0 / (ih(im) * s);
    const [l,t,r,b] = shot.box, fx = (l + r) / 200, fy = (t + b) / 200 / CROP;
    const cl = v => Math.max(0, Math.min(1, v));
    return coverMap(im.naturalWidth, ih(im), W0, H0, vw < 1 ? cl((fx - vw/2) / (1 - vw)) : .5, vh < 1 ? cl((fy - vh/2) / (1 - vh)) : .5);
  }
  function fit(){
    const dpr = Math.min(2, devicePixelRatio || 1);
    cv.width = Math.max(1, Math.round(root.clientWidth * dpr)); cv.height = Math.max(1, Math.round(root.clientHeight * dpr));
    const im = cur();
    map = im && im.naturalWidth ? mapFor(im, root.clientWidth, root.clientHeight) : null;
  }
  if ('ResizeObserver' in window) new ResizeObserver(fit).observe(root); else addEventListener('resize', fit);
  const boxRect = () => { const [l,t,r,b] = shot.box; return [map.x(l), map.y(t / CROP), map.x(r), map.y(b / CROP)]; };
  const subj = () => ({ rect:boxRect(), name: look ? 'SUBJECT AWARE' : 'Blanc', sub: look ? 'LOOKING AT CAMERA' : 'SUBJECT · 98.9%' });
  const tr = Tracker(root, T, () => (has && map && !look) ? [subj()] : [], p => root.classList.toggle('hot', !!p && talk && (!opt.canLook || opt.canLook())));

  /* 빈 캠 — 선으로 그린 장소 (이미지가 없을 때) */
  function scene(g, w, h){
    g.fillStyle = '#070807'; g.fillRect(0,0,w,h);
    g.strokeStyle = 'rgba(238,240,234,.34)'; g.lineWidth = Math.max(1, w/180);
    const L = (a,b,c,d) => { g.beginPath(); g.moveTo(a*w,b*h); g.lineTo(c*w,d*h); g.stroke(); };
    const vx=.55, vy=.42;
    [[0,0],[1,0],[0,1],[1,1]].forEach(([x,y]) => L(x,y,vx+(x-.5)*.18,vy+(y-.5)*.22));
    g.strokeRect((vx-.09)*w,(vy-.11)*h,.18*w,.22*h);
  }
  /* 이미지 → 흑백 감시 화면 */
  function footage(g, w, h, im){
    const m = mapFor(im, w, h);
    g.drawImage(im, 0, 0, im.naturalWidth, ih(im), m.ox, m.oy, m.dw, m.dh);
    const d = g.getImageData(0,0,w,h), a = d.data;
    for (let i=0;i<a.length;i+=4){
      let v = (a[i]*.3 + a[i+1]*.59 + a[i+2]*.11) / 255;
      v = Math.min(1, Math.max(0, (v - .12) * 1.2)) * .8;
      a[i] = 222*v; a[i+1] = 6 + 228*v; a[i+2] = 216*v;

  function layout(){

  box(148,36,16,40,16,3,'','m-dock',{vs:6});
  for (const x of [156,168,180]) cyl(x,53,16,22,1.2);
  box(154,58,0,28,9,4,'sub');
  L3([168,58,4],[168,58,10],'sbl');

  /* 위성 플랫폼 + 연결교 */
  box(30,104,22,6,30,2,'',' ',{vs:5});
  rail([30,104,26],[30,134,26]); rail([36,104,26],[36,134,26]);
  for (const [x,y] of [[16,138],[50,138],[16,166],[50,166]]) cyl(x,y,-10,18,2.6,'','',3);
  L3([16,166,2],[50,166,16],'br'); L3([16,166,16],[50,166,2],'br'); L3([50,138,2],[50,166,16],'br'); L3([50,138,16],[50,166,2],'br');
  box(10,134,18,46,36,4,'',' ',{fl:2});
  box(18,142,22,22,20,9,'','m-quarters',{win:[2.5,3]});
  L3([46,150,22],[46,150,48]); for (const k of [30,36,42]) L3([43,150,k],[49,150,k],'dl');

  /* ── 캠 · 인물 · 관찰자 ── */
  const CAMS = {
    1:{ at:[18,142,31],  m:'m-quarters', loc:'BLANC ROOM',    s:[29,150,26], route:[[114,49,T+15],[114,49,T],[90,49,T],[90,51,T],[68,51,T+.6],[68,102,T+.6],[33,102,T],[33,138,26],[29,150,26]] },
    2:{ at:[68,14,T+5],  m:'m-cor',      loc:'CORRIDOR B-2',  s:[68,48,T+.6], route:[[114,49,T+15],[114,49,T],[90,49,T],[90,51,T],[68,51,T+.6],[68,48,T+.6]] },
    3:{ at:[46,20,T+12], m:'m-dome',     loc:'TRAINING ROOM', s:[34,38,T],    route:[[114,49,T+15],[114,49,T],[90,49,T],[90,51,T],[68,51,T+.6],[68,38,T+.6],[34,38,T]] },
  };
  const you = pt(114,49,T+15);
  out.push(`<rect class="you" x="${f(you[0]-3)}" y="${f(you[1]-3)}" width="6" height="6"/><text class="big" x="${f(you[0]+6)}" y="${f(you[1]+3)}">YOU</text>`);
  out.push(`<path class="route" id="route"/><circle class="ping" id="ping" r="3"/><circle class="subj" id="subj" r="3"/><text class="big" id="subjt">BLANC</text>`);

  /* ── 지시선 라벨 — 글자 크기는 도면 크기에 비례(화면에선 늘 같은 크기) ── */
  let minX = Math.min(...pts.map(p => p[0])), maxX = Math.max(...pts.map(p => p[0]));
  const k = (maxX - minX) / 194, fs = 5.2 * k;
  const iso = $('#iso'); iso.style.setProperty('--fs', f(fs) + 'px');
  const CALL = [
    { at:[115,15,T+60], t:'HARMONY COUNSELING', r:1 }, { at:[128,30,T+20], t:'CENTRAL CORE', r:1 }, { at:[80,99,T], t:'LOUNGE', r:1 }, { at:[126,49,T+10], t:"DR. VANCE'S LAB", r:1 },
    { at:[30,24,T+16], t:'TRAINING ROOM', r:0 }, { at:[6,80,T+12], t:'RESONANCE LAB', r:0 },
    { at:[122,30,-24], t:'EMERGENCY STABILIZATION', r:1 }, { at:[16,166,-6], t:'S-CLASS QUARTERS', r:0 },
  ];
  const body = pts.slice();   // 건물 윤곽 — 라벨은 그 높이에서 건물이 끝나는 곳 바로 바깥에
  for (const c of CALL){ const a = pt(...c.at, false);
    const near = body.filter(p => Math.abs(p[1] - a[1]) < 7 * k).map(p => p[0]);
    const edge = near.length ? (c.r ? Math.max(a[0], ...near) : Math.min(a[0], ...near)) : a[0];
    const x = c.r ? edge + 8*k : edge - 8*k, tx = c.r ? x + 3*k : x - 3*k;
    out.push(`<path class="co" d="M${f(a[0])} ${f(a[1])} L${f(x)} ${f(a[1])}"/><circle class="cn" cx="${f(a[0])}" cy="${f(a[1])}" r="${f(1.8*k)}"/><text class="ct" x="${f(tx)}" y="${f(a[1]+1.8*k)}" text-anchor="${c.r ? 'start' : 'end'}">${c.t}</text>`);
    pts.push([c.r ? tx + c.t.length * 3.4 * k : tx - c.t.length * 3.4 * k, a[1]]);
  }
  minX = Math.min(...pts.map(p => p[0])); maxX = Math.max(...pts.map(p => p[0]));
  const minY = Math.min(...pts.map(p => p[1])), maxY = Math.max(...pts.map(p => p[1]));
  iso.setAttribute('viewBox', `${f(minX-6*k)} ${f(minY-8*k)} ${f(maxX-minX+12*k)} ${f(maxY-minY+14*k)}`);
  iso.innerHTML = out.join('');
  iso.querySelectorAll('.cam,.subj,.ping').forEach(e => e.setAttribute('r', f(+e.getAttribute('r') * k)));
  iso.querySelectorAll('.you').forEach(e => { const s = 6 * k, x = +e.getAttribute('x') + 3, y = +e.getAttribute('y') + 3; e.setAttribute('x', f(x - s/2)); e.setAttribute('y', f(y - s/2)); e.setAttribute('width', f(s)); e.setAttribute('height', f(s)); });

  let c = CAMS[pk] || CAMS[1];
  function place(n){
    c = CAMS[n] || CAMS[1];
    iso.querySelectorAll('.hot').forEach(e => e.classList.remove('hot')); $('#' + c.m).classList.add('hot');
    $('#loc').textContent = c.loc;
    $('#route').setAttribute('d', 'M' + c.route.map(q => P3(...q).map(f).join(' ')).join(' L'));
    const s = P3(...c.s);
    for (const id of ['subj','ping']){ $('#' + id).setAttribute('cx', f(s[0])); $('#' + id).setAttribute('cy', f(s[1])); }
    $('#subjt').setAttribute('x', f(s[0] + 5*k)); $('#subjt').setAttribute('y', f(s[1] - 5*k));
  }
  place(pk);
  function set(k, b, s){
    for (const x in L) L[x].classList.toggle('on', x === k);
    sig.classList.toggle('red', k === 'R');
    $('#sb').textContent = b; $('#ss').textContent = s;
    $('#p1').textContent = k === 'R' ? 'SUBJECT IS LOOKING BACK' : 'OBSERVATION IN PROGRESS';
    $('#p2').textContent = k === 'R' ? '들켰습니다 · 즉시 화면을 돌리십시오' : '관찰 중 · 관계자 외 출입 금지';
  }
  const idle = () => set('Y', 'Tracking', `SUBJECT AT ${c.loc}`);
  set('G', 'Clear', 'NO SUBJECT IN RANGE');
  setTimeout(idle, 900);
  let tm;
  on(m => {
    if (m.t === 'aware'){ place(m.cam); set('R', 'Alert', `SUBJECT AWARE · CAM-${pad(m.cam)}`); clearTimeout(tm); tm = setTimeout(idle, AWARE_MS + 200); }
    if (m.t === 'pick') place(m.cam);
    if (m.t === 'calm') idle();
  });
  if (Q.get('aware')) setTimeout(() => set('R', 'Alert', `SUBJECT AWARE · CAM-${pad(pk)}`), 1000);
}

/* ================= VITAL ================= */
if (W === 'graph') {
  const gr = $('#gr'), plot = $('#plot'), cv = $('#cv'), g = cv.getContext('2d');
  panelFrame(gr);
  /* 원형 게이지 — 눈금 60개, 진행 호, 회전 점선 */
  const gg = $('#gg'); let h = '';
  for (let i = 0; i < 60; i++){ const a = i * 6 * Math.PI / 180, L = i % 5 ? 3 : 7, r0 = 58, r1 = 58 - L;
    h += `<line class="tk${i % 5 ? '' : ' l'}" x1="${(60 + r0*Math.sin(a)).toFixed(1)}" y1="${(60 - r0*Math.cos(a)).toFixed(1)}" x2="${(60 + r1*Math.sin(a)).toFixed(1)}" y2="${(60 - r1*Math.cos(a)).toFixed(1)}"/>`; }
  gg.innerHTML = h + `<circle class="bg" cx="60" cy="60" r="45"/><circle class="arc" id="arc" cx="60" cy="60" r="45"/><circle class="rot" cx="60" cy="60" r="37"/>`;
  const C = 2 * Math.PI * 45, arc = $('#arc');
  const cells = $('#cells'); cells.innerHTML = Array.from({ length:10 }, (_, i) => `<i class="${i < 9 ? '' : 'half'}"></i>`).join('');
  const n = 140, A = new Array(n).fill(72), B = new Array(n).fill(.5);
  let alarm = 0, ph = 0, base = 72;
  function fit(){ const d = Math.min(2, devicePixelRatio||1); cv.width = cv.clientWidth*d; cv.height = cv.clientHeight*d; }
  addEventListener('resize', fit); fit();
  function step(){
    ph += 1;
    const beat = (ph % 14 === 0) ? 18 : (ph % 14 === 1 ? -9 : 0);
    base += ((alarm > 0 ? 128 : 72) - base) * .08;
    A.push(base + beat * (alarm > 0 ? 1.8 : 1) + (Math.random()-.5) * 3); A.shift();
    B.push(.5 + Math.sin(ph/9)*.12 + (Math.random()-.5)*.05 + (alarm > 0 ? (Math.random()-.5)*.4 : 0)); B.shift();
    if (alarm > 0) alarm--;
    gr.classList.toggle('red', alarm > 0);
    $('#gdot').className = 'dot' + (alarm > 0 ? ' r' : '');
    $('#chip').textContent = alarm > 0 ? 'ANOMALY' : 'STABLE';
    $('#bpm').textContent = Math.round(base);
    arc.style.strokeDasharray = `${(Math.min(1, base / 160) * C).toFixed(1)} ${C.toFixed(1)}`;
    $('#sgv').textContent = (34 + Math.random()*1.4).toFixed(1) + ' dB';
    draw();
  }
  function draw(){
    const w = cv.width, h = cv.height, d = Math.min(2, devicePixelRatio||1);
    g.clearRect(0,0,w,h);
    g.strokeStyle = 'rgba(238,240,234,.28)'; g.lineWidth = 1*d; g.beginPath();
    B.forEach((v,i) => { const x = i/(n-1)*w, y = h - v*h*.9; i ? g.lineTo(x,y) : g.moveTo(x,y); }); g.stroke();
    const col = alarm > 0 ? '#ff2a3a' : '#39ff14';
    g.strokeStyle = col; g.lineWidth = 1.2*d; g.beginPath();
    A.forEach((v,i) => { const x = i/(n-1)*w, y = h - (v-48)/96*h; i ? g.lineTo(x,y) : g.moveTo(x,y); }); g.stroke();
    g.fillStyle = col; const ly = h - (A[n-1]-48)/96*h; g.beginPath(); g.arc(w-4*d, ly, 2.5*d, 0, 7); g.fill();
  }
  setInterval(step, 90);
  plot.addEventListener('mousemove', e => {
    const r = plot.getBoundingClientRect(), x = e.clientX - r.left, i = Math.round(x / r.width * (n-1));
    $('#xh').style.left = x + 'px';
    $('#xh span').textContent = `T-${((n-1-i)*0.09).toFixed(1)}s · ${Math.round(A[i])} BPM`;
  });
  on(m => {
    if (m.t === 'aware') alarm = Math.round(AWARE_MS / 90);
    if (m.t === 'focus' || m.t === 'id') $('#who').textContent = m.who;
  });
  if (Q.get('aware')) alarm = 999;
}
</script>
</body>
